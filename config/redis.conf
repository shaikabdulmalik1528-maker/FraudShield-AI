# ==============================================================================
# FraudShield 3.0 Production Redis Configuration
# Enables AOF persistence with 1-second sync, memory limits, and security tuning
# ==============================================================================

# Network & Connection Settings
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 300

# Persistence: Append Only File (AOF)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Persistence: Snapshotting (RDB Fallback)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# Memory Management (512MB RAM cap with volatile-lru eviction)
maxmemory 512mb
maxmemory-policy volatile-lru
maxmemory-samples 5

# Security & Limits
maxclients 10000
slowlog-log-slower-than 10000
slowlog-max-len 128
